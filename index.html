<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вогонь та Вода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe3b8;--ink:#2b1b3d;--panel:#fff7e6;--fire:#ff4a1c;--water:#1c8bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1030;--ink:#fff3dc;--panel:#33224d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1030;--ink:#fff3dc;--panel:#33224d;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:min(100%,calc((100vh - 110px)*1.4286))}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;font-weight:700;font-size:clamp(12px,2.4vw,18px)}
#hud span{white-space:nowrap}
.f{color:var(--fire)}.w{color:var(--water)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffd400;outline-offset:2px}
#pause{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:2px 12px}
canvas{display:block;width:100%;aspect-ratio:800/560;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#ov{position:absolute;left:0;right:0;top:34px;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.62);border-radius:18px}
#ov[hidden]{display:none}
#card{background:var(--panel);color:var(--ink);padding:22px 28px;border-radius:24px;text-align:center;max-width:80%;box-shadow:0 8px 0 rgba(0,0,0,.3);animation:pop .35s ease-out}
#card h1{margin:0 0 6px;font-size:clamp(22px,5vw,38px);background:linear-gradient(90deg,var(--fire),var(--water));-webkit-background-clip:text;background-clip:text;color:transparent}
#card p{margin:4px 0 14px;font-size:clamp(12px,2.2vw,16px);line-height:1.4}
#card button{border:0;border-radius:14px;padding:8px 20px;margin:3px;font-weight:700;font-size:clamp(14px,2.6vw,18px);color:#fff;background:linear-gradient(135deg,var(--fire),#ff9d1c);box-shadow:0 4px 0 rgba(0,0,0,.3)}
#card button.alt{background:linear-gradient(135deg,var(--water),#37d4ff)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#touch{display:none;width:100%;justify-content:space-between;padding:0 10px;box-sizing:border-box;gap:6px}
#touch div{display:flex;gap:6px}
.tb{width:54px;height:54px;border-radius:16px;border:0;font-size:22px;color:#fff;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tb.f{background:var(--fire);color:#fff}.tb.w{background:var(--water);color:#fff}
@media (pointer:coarse){#touch{display:flex}#wrap{width:min(100%,calc((100vh - 230px)*1.4286))}}
</style></head>
<body>
<div id="wrap">
  <div id="hud"><span id="hl"></span><span class="f" id="hf"></span><span class="w" id="hw"></span><span id="ht"></span><button id="pause" aria-label="Пауза">Пауза</button></div>
  <canvas id="cv" width="800" height="560"></canvas>
  <div id="ov"><div id="card"><h1 id="ot"></h1><p id="op"></p><div id="ob"></div></div></div>
</div>
<div id="touch">
  <div><button class="tb f" data-k="KeyA">◀</button><button class="tb f" data-k="KeyW">▲</button><button class="tb f" data-k="KeyD">▶</button></div>
  <div><button class="tb w" data-k="ArrowLeft">◀</button><button class="tb w" data-k="ArrowUp">▲</button><button class="tb w" data-k="ArrowRight">▶</button></div>
</div>
<script>
"use strict";
// ===== Константи =====
const T = 40, COLS = 20, ROWS = 14, W = T * COLS, H = T * ROWS;           // розмір тайла та сітки
const PHYS = { G: 1800, JUMP: 720, SPEED: 230, MAXFALL: 900, PW: 24, PH: 32, PLAT: 140, STEP: 22 };
const SAVE_KEY = 'fw_progress_v1';
const KEYS = { fire: { l: 'KeyA', r: 'KeyD', u: 'KeyW' }, water: { l: 'ArrowLeft', r: 'ArrowRight', u: 'ArrowUp' } };
const NAMES = { fire: 'Вогник', water: 'Водичка' };
// Небезпеки: хто гине, колір, повідомлення
const HAZ = {
  W: { kills: ['fire'], c: '#2aa8ff', msg: 'Вогник згас у воді' },
  L: { kills: ['water'], c: '#ff5a1f', msg: 'Водичка випарувалась у лаві' },
  G: { kills: ['fire', 'water'], c: '#4cd137', msg: 'Зелена рідина отруйна для обох' }
};

// ===== Рівні (легко додавати нові) =====
// solids: [колонка, рядок, ширина, висота]; pools: [колонка, ширина, тип]; fire/water: стартовий тайл (низ персонажа)
// fd/wd: тайл підлоги дверей; gems: [тип f|w, колонка, рядок]; plats: рухомі платформи; buttons: кнопки
const LEVELS = [
  { name: 'Перші кроки',
    solids: [[2, 11, 4, 1], [6, 9, 4, 1], [10, 7, 4, 1], [14, 5, 6, 1]],
    pools: [[12, 3, 'W']], fire: [1, 12], water: [2, 12], fd: [16, 4], wd: [18, 4],
    gems: [['f', 17, 12], ['w', 3, 10]] },
  { name: 'Підйомник', latch: true,
    solids: [[8, 8, 3, 5], [16, 9, 4, 1], [14, 11, 2, 1]],
    pools: [[12, 2, 'G']], fire: [1, 12], water: [2, 12], fd: [16, 8], wd: [18, 8],
    plats: [{ id: 'a', x: 6, y: 12.5, w: 2, h: 0.5, dy: -4.5 }],
    buttons: [{ id: 'a', c: 3, r: 12 }],
    gems: [['f', 15, 10], ['w', 12, 10]] },
  { name: 'Командна робота',
    solids: [[9, 6, 6, 1], [2, 3, 7, 1], [15, 9, 2, 1]],
    pools: [[6, 3, 'W'], [10, 3, 'L'], [14, 2, 'G']], fire: [1, 12], water: [2, 12], fd: [3, 2], wd: [5, 2],
    plats: [{ id: 'a', x: 17, y: 12.5, w: 2, h: 0.5, dy: -4.3 }],
    buttons: [{ id: 'a', c: 3, r: 12 }, { id: 'a', c: 15, r: 8 }],
    gems: [['f', 7, 10], ['w', 11, 10], ['f', 12, 5], ['w', 10, 5]] }
];

// ===== Input: клавіатура + екранні кнопки =====
const Input = {
  down: {},
  init() {
    addEventListener('keydown', e => {
      if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
      this.down[e.code] = true;
      if (e.repeat) return;
      if (e.code === 'Escape' || e.code === 'KeyP') Game.togglePause();
      if (e.code === 'KeyR') Game.restart();
    });
    addEventListener('keyup', e => { this.down[e.code] = false; });
    addEventListener('blur', () => { this.down = {}; if (Game.state === 'play') Game.togglePause(); });
    document.querySelectorAll('.tb').forEach(b => {
      const k = b.dataset.k, on = v => e => { e.preventDefault(); this.down[k] = v; };
      b.addEventListener('pointerdown', on(true));
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, on(false)));
    });
  }
};

// ===== Звук (Web Audio API) =====
const Sfx = {
  ctx: null,
  tone(f, d = .12, type = 'square', slide = 0, vol = .06) {
    try {
      const c = this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(), t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(c.destination); o.start(); o.stop(t + d);
    } catch (e) { /* звук недоступний — ігноруємо */ }
  },
  jump() { this.tone(320, .15, 'square', 300); },
  gem() { this.tone(880, .08, 'triangle'); setTimeout(() => this.tone(1320, .12, 'triangle'), 70); },
  die() { this.tone(300, .5, 'sawtooth', -250); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, .2, 'triangle'), i * 120)); }
};

// ===== Level: завантаження рівня з опису =====
class Level {
  constructor(d) {
    this.def = d; this.name = d.name;
    this.grid = Array.from({ length: ROWS }, (_, r) => Array.from({ length: COLS }, (_, c) =>
      (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) ? '#' : '.'));
    d.solids.forEach(([c, r, w, h]) => { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) this.grid[y][x] = '#'; });
    this.hazards = [];
    d.pools.forEach(([c, w, k]) => { for (let x = c; x < c + w; x++) this.hazards.push({ k, x: x * T, y: (ROWS - 2) * T + 10, w: T, h: T - 10 }); });
    this.gems = d.gems.map(([t, c, r]) => ({ t: t === 'f' ? 'fire' : 'water', x: c * T + 10, y: r * T + 10, w: 20, h: 20, got: false }));
    this.plats = (d.plats || []).map(p => ({ id: p.id, x: p.x * T, y0: p.y * T, y: p.y * T, w: p.w * T, h: p.h * T, dy: p.dy * T }));
    this.buttons = (d.buttons || []).map(b => ({ id: b.id, x: b.c * T, y: b.r * T + T - 8, w: T, h: 8, on: false }));
    this.latch = !!d.latch; this.latched = new Set(); this.active = new Set();
    this.doors = {
      fire: { x: d.fd[0] * T, y: (d.fd[1] - 1) * T, w: T, h: 2 * T },
      water: { x: d.wd[0] * T, y: (d.wd[1] - 1) * T, w: T, h: 2 * T }
    };
  }
}

// ===== Physics: гравітація та AABB-колізії =====
const Physics = {
  hit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  solids(lv, p, other) {
    const out = [], c0 = Math.max(0, Math.floor(p.x / T) - 1), c1 = Math.min(COLS - 1, Math.floor((p.x + p.w) / T) + 1);
    const r0 = Math.max(0, Math.floor(p.y / T) - 1), r1 = Math.min(ROWS - 1, Math.floor((p.y + p.h) / T) + 1);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (lv.grid[r][c] === '#') out.push({ x: c * T, y: r * T, w: T, h: T });
    return out.concat(lv.plats, [other]);
  },
  move(lv, p, other, dt) {
    p.vy = Math.min(p.vy + PHYS.G * dt, PHYS.MAXFALL);
    p.x += p.vx * dt;
    for (const s of this.solids(lv, p, other)) if (this.hit(p, s)) {
      if (p.y + p.h - s.y <= PHYS.STEP && p.vy >= 0 && p.onGround) { p.y = s.y - p.h; continue; }  // невеликий «східець»
      if (p.vx > 0) p.x = s.x - p.w; else if (p.vx < 0) p.x = s.x + s.w;
    }
    p.onGround = false; p.y += p.vy * dt;
    for (const s of this.solids(lv, p, other)) if (this.hit(p, s)) {
      if (p.vy > 0) { p.y = s.y - p.h; p.onGround = true; } else if (p.vy < 0) p.y = s.y + s.h;
      p.vy = 0;
    }
  }
};

// ===== Player =====
class Player {
  constructor(type, [c, r]) {
    this.type = type; this.w = PHYS.PW; this.h = PHYS.PH;
    this.x = c * T + (T - this.w) / 2; this.y = (r + 1) * T - this.h;
    this.vx = 0; this.vy = 0; this.onGround = false; this.dir = 1;
  }
  control() {
    const k = KEYS[this.type], d = Input.down;
    this.vx = ((d[k.r] ? 1 : 0) - (d[k.l] ? 1 : 0)) * PHYS.SPEED;
    if (this.vx) this.dir = Math.sign(this.vx);
    if (d[k.u] && this.onGround) { this.vy = -PHYS.JUMP; this.onGround = false; Sfx.jump(); }
  }
  inDoor(d) {
    const cx = this.x + this.w / 2, b = this.y + this.h;
    return cx > d.x && cx < d.x + d.w && b >= d.y + d.h - 6 && b <= d.y + d.h + 2;
  }
}

// ===== Renderer: малювання на Canvas 2D =====
const Renderer = {
  cv: document.getElementById('cv'), ctx: null,
  init() { this.ctx = this.cv.getContext('2d'); },
  rr(x, y, w, h, r) { const c = this.ctx; c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); },
  draw(g, t) {
    const c = this.ctx, lv = g.lv; if (!lv) return;
    const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#2a1a4a'); bg.addColorStop(1, '#4a2a5c');
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++) for (let x = 0; x < COLS; x++) if (lv.grid[r][x] === '#') {
      c.fillStyle = '#3b3650'; c.fillRect(x * T, r * T, T, T);
      c.fillStyle = '#55507a'; if (lv.grid[r - 1] && lv.grid[r - 1][x] !== '#') c.fillRect(x * T, r * T, T, 5);
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.strokeRect(x * T + .5, r * T + .5, T - 1, T - 1);
    }
    // небезпеки з пульсацією
    lv.hazards.forEach(h => {
      c.globalAlpha = .78 + .22 * Math.sin(t * 5 + h.x); c.fillStyle = HAZ[h.k].c; c.beginPath(); c.moveTo(h.x, h.y + h.h);
      for (let x = 0; x <= h.w; x += 4) c.lineTo(h.x + x, h.y + 2 + Math.sin(t * 4 + (h.x + x) * .2) * 2);
      c.lineTo(h.x + h.w, h.y + h.h); c.fill(); c.globalAlpha = 1;
    });
    // двері з підсвіткою
    ['fire', 'water'].forEach(k => {
      const d = lv.doors[k], near = g.players.some(p => p.type === k && Math.abs(p.x + p.w / 2 - d.x - d.w / 2) < 60 && Math.abs(p.y + p.h - d.y - d.h) < 10);
      c.save(); if (near) { c.shadowColor = k === 'fire' ? '#ff9d1c' : '#37d4ff'; c.shadowBlur = 24; }
      c.fillStyle = k === 'fire' ? '#c92a12' : '#1565c0'; this.rr(d.x + 2, d.y + 2, d.w - 4, d.h - 2, 12); c.fill();
      c.fillStyle = k === 'fire' ? '#ff7a2b' : '#4db3ff'; this.rr(d.x + 8, d.y + 8, d.w - 16, d.h - 8, 8); c.fill(); c.restore();
    });
    lv.buttons.forEach(b => { c.fillStyle = '#ffd400'; this.rr(b.x + 6, b.y + (b.on ? 4 : 0), b.w - 12, b.h - (b.on ? 4 : 0), 4); c.fill(); });
    lv.plats.forEach(p => { c.fillStyle = '#8a7fb0'; this.rr(p.x, p.y, p.w, p.h, 5); c.fill(); c.fillStyle = '#ffd400'; c.fillRect(p.x + 4, p.y + 3, p.w - 8, 3); });
    // алмази, що обертаються
    lv.gems.forEach(m => {
      if (m.got) return; const cx = m.x + 10, cy = m.y + 10 + Math.sin(t * 3 + m.x) * 2, s = Math.cos(t * 3 + m.x);
      c.fillStyle = m.t === 'fire' ? '#ff3b3b' : '#33b6ff'; c.beginPath();
      c.moveTo(cx, cy - 11); c.lineTo(cx + 10 * s, cy); c.lineTo(cx, cy + 11); c.lineTo(cx - 10 * s, cy); c.fill();
      c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(cx - 2, cy - 7, 3, 5);
    });
    g.players.forEach(p => this.player(p, t));
  },
  player(p, t) {
    const c = this.ctx, f = p.type === 'fire', cx = p.x + p.w / 2;
    const gr = c.createLinearGradient(0, p.y, 0, p.y + p.h);
    gr.addColorStop(0, f ? '#ffb02e' : '#8fe6ff'); gr.addColorStop(1, f ? '#ff3d1f' : '#1d6fe8');
    c.fillStyle = gr; this.rr(p.x, p.y + 8, p.w, p.h - 8, 9); c.fill();
    c.fillStyle = f ? '#ffd23a' : '#b9f1ff';
    if (f) for (const i of [-7, 0, 7]) { c.beginPath(); c.moveTo(cx + i - 4, p.y + 10); c.lineTo(cx + i, p.y - 6 + Math.sin(t * 14 + i) * 4); c.lineTo(cx + i + 4, p.y + 10); c.fill(); }
    else { const w = Math.sin(t * 6) * 2; c.beginPath(); c.moveTo(cx, p.y - 7 + w); c.quadraticCurveTo(cx + 11, p.y + 5, cx, p.y + 11); c.quadraticCurveTo(cx - 11, p.y + 5, cx, p.y - 7 + w); c.fill(); }
    c.fillStyle = '#fff'; [-5, 5].forEach(o => { c.beginPath(); c.arc(cx + o, p.y + 17, 4, 0, 7); c.fill(); });
    c.fillStyle = '#222'; [-5, 5].forEach(o => { c.beginPath(); c.arc(cx + o + p.dir * 1.5, p.y + 17, 2, 0, 7); c.fill(); });
  }
};

// ===== UI: HUD та меню =====
const UI = {
  $: id => document.getElementById(id),
  fmt: s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'),
  hud(g) {
    const lv = g.lv, n = k => lv.gems.filter(m => m.t === k && m.got).length + '/' + lv.gems.filter(m => m.t === k).length;
    this.$('hl').textContent = `Рівень ${g.idx + 1}: ${lv.name}`; this.$('hf').textContent = '🔥 ' + n('fire');
    this.$('hw').textContent = '💧 ' + n('water'); this.$('ht').textContent = '⏱ ' + this.fmt(g.time);
  },
  show(title, text, btns) {
    this.$('ot').textContent = title; this.$('op').textContent = text;
    const b = this.$('ob'); b.innerHTML = '';
    btns.forEach(([label, fn, alt]) => { const e = document.createElement('button'); e.textContent = label; if (alt) e.className = 'alt'; e.onclick = fn; b.appendChild(e); });
    this.$('ov').hidden = false; b.firstChild && b.firstChild.focus();
  },
  hide() { this.$('ov').hidden = true; }
};

// ===== Game: головний цикл і стан =====
const Game = {
  state: 'menu', idx: 0, lv: null, players: [], time: 0, last: 0, tt: 0,
  save(n) { try { localStorage.setItem(SAVE_KEY, String(n)); } catch (e) { /* сховище недоступне */ } },
  load() { try { const v = parseInt(localStorage.getItem(SAVE_KEY), 10); return v >= 0 && v < LEVELS.length ? v : 0; } catch (e) { return 0; } },
  start(i) {
    this.idx = i; this.lv = new Level(LEVELS[i]); this.time = 0;
    this.players = [new Player('fire', this.lv.def.fire), new Player('water', this.lv.def.water)];
    this.state = 'play'; UI.hide(); UI.hud(this);
  },
  restart() { if (this.lv && this.state !== 'menu') this.start(this.idx); },
  togglePause() {
    if (this.state === 'play') { this.state = 'pause'; UI.show('Пауза', 'Вогник: W A D · Водичка: стрілки · R — рестарт', [['Продовжити', () => this.togglePause()]]); }
    else if (this.state === 'pause') { this.state = 'play'; UI.hide(); }
  },
  lose(msg) { this.state = 'lose'; Sfx.die(); UI.show('Ой!', msg, [['Спробувати ще раз', () => this.start(this.idx)]]); },
  win() {
    this.state = 'win'; Sfx.win(); const next = this.idx + 1;
    if (next < LEVELS.length) { this.save(next); UI.show('Рівень пройдено!', `Час: ${UI.fmt(this.time)}`, [['Наступний рівень', () => this.start(next)], ['Ще раз', () => this.start(this.idx), true]]); }
    else { this.save(0); UI.show('Перемога!', 'Ви пройшли всі рівні. Вогник і Водичка щасливі!', [['Грати знову', () => this.start(0)]]); }
  },
  update(dt) {
    const lv = this.lv, [fi, wa] = this.players, H_ = Physics.hit;
    this.time += dt;
    // кнопки й рухомі платформи
    const pressed = new Set();
    lv.buttons.forEach(b => { b.on = this.players.some(p => H_(p, { x: b.x, y: b.y - 3, w: b.w, h: b.h + 3 })); if (b.on) { pressed.add(b.id); lv.latched.add(b.id); } });
    lv.active = lv.latch ? lv.latched : pressed;
    lv.plats.forEach(q => {
      const want = lv.active.has(q.id) ? q.y0 + q.dy : q.y0, d = Math.max(-PHYS.PLAT * dt, Math.min(PHYS.PLAT * dt, want - q.y));
      if (!d) return;
      this.players.forEach(p => { if (p.onGround && Math.abs(p.y + p.h - q.y) <= 4 && p.x + p.w > q.x && p.x < q.x + q.w) p.y += d; });  // пасажири їдуть разом
      q.y += d;
    });
    // персонажі
    this.players.forEach(p => { p.control(); Physics.move(lv, p, p === fi ? wa : fi, dt); });
    for (const p of this.players) {
      if (p.y > H + 80 || p.x < -80 || p.x > W + 80) return this.lose(`${NAMES[p.type]} випав за межі рівня`);  // обробка виходу за межі
      for (const h of lv.hazards) if (HAZ[h.k].kills.includes(p.type) && H_(p, { x: h.x + 6, y: h.y, w: h.w - 12, h: h.h })) return this.lose(HAZ[h.k].msg);
      lv.gems.forEach(m => { if (!m.got && m.t === p.type && H_(p, m)) { m.got = true; Sfx.gem(); } });
    }
    if (fi.inDoor(lv.doors.fire) && wa.inDoor(lv.doors.water)) this.win();
    UI.hud(this);
  },
  loop(ts) {
    const dt = Math.min((ts - Game.last) / 1000 || 0, .033); Game.last = ts; Game.tt += dt;
    if (Game.state === 'play') Game.update(dt);
    Renderer.draw(Game, Game.tt); requestAnimationFrame(Game.loop);
  },
  init() {
    Renderer.init(); Input.init();
    UI.$('pause').onclick = () => this.togglePause();
    const saved = this.load(), btns = [[saved ? `Продовжити: рівень ${saved + 1}` : 'Грати', () => this.start(saved)]];
    if (saved) btns.push(['Спочатку', () => { this.save(0); this.start(0); }, true]);
    this.lv = new Level(LEVELS[0]); this.players = [new Player('fire', LEVELS[0].fire), new Player('water', LEVELS[0].water)];
    UI.hud(this);
    UI.show('Вогонь та Вода', 'Вогник (W A D) і Водичка (стрілки) мають одночасно дійти до своїх дверей. Збирайте алмази свого кольору, обходьте чужу стихію, зелена рідина небезпечна для обох. Пауза: Esc або P, рестарт: R.', btns);
    requestAnimationFrame(this.loop);
  }
};
Game.init();
</script>
